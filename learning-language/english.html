<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>美東旅遊英文實戰手冊</title>
  <style>
    /* =========================================================================
       1. 設計系統變數與基礎重置 (低明度日系清爽風・老花眼友善高對比)
       ========================================================================= */
    :root {
      --bg-page: #F7F8FA;
      --bg-card: #FFFFFF;
      --bg-subtle: #F1F4F8;
      --bg-mastered: #D6F0E0;
      --border-default: #DDE2E8;
      --border-strong: #D5DCE4;
      --border-core: #C94A4A;
      --border-mastered: #7CC49B;
      --accent-mastered: #2A7B56;
      --text-primary: #1F2937;
      --text-strong: #111827;
      --text-secondary: #4B5563;
      --text-muted: #5C6773;
      --sidebar-width: 240px;
      --radius-md: 10px;
      --radius-lg: 12px;
      --font-sans: "Inter", "PingFang TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      color: inherit;
    }

    /* =========================================================================
       2. 全視窗雙區固定骨架 (桌機鎖定 100vh，僅右側卡片區獨立捲動)
       ========================================================================= */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .app-header {
      flex-shrink: 0;
      display: flex;
      align-items: stretch;
      background-color: var(--bg-card);
      border-bottom: 1.5px solid var(--border-default);
      z-index: 30;
    }

    .header-brand {
      width: var(--sidebar-width);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 12px;
      border-right: 1.5px solid var(--border-default);
    }

    .header-brand h1 {
      margin: 0;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text-primary);
      line-height: 1.2;
      white-space: nowrap;
    }

    .header-controls-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 11px;
      padding: 8px 14px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .seg-group {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background-color: var(--bg-subtle);
      border: 1.5px solid var(--border-default);
      border-radius: 9px;
      padding: 3px;
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-secondary);
      white-space: nowrap;
      transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .ctrl-btn:hover {
      background-color: #E2E8F0;
      color: var(--text-strong);
    }

    .ctrl-btn.is-active {
      background-color: #334155;
      color: #FFFFFF;
    }

    .ctrl-btn.is-core-active {
      background-color: #FFFFFF;
      color: var(--border-core);
      box-shadow: inset 0 0 0 1.5px var(--border-core);
    }

    .ctrl-btn.is-rate-active {
      background-color: #5B768A;
      color: #FFFFFF;
    }

    .outline-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      background-color: #FFFFFF;
      color: var(--text-secondary);
      border: 1.5px solid var(--border-strong);
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .outline-btn:hover {
      background-color: var(--bg-subtle);
      color: var(--text-strong);
    }

    .outline-btn.is-active {
      background-color: #334155;
      border-color: #334155;
      color: #FFFFFF;
    }

    .outline-btn.is-hide-active {
      background-color: var(--accent-mastered);
      border-color: var(--accent-mastered);
      color: #FFFFFF;
    }

    .outline-btn.is-sync-btn {
      color: #3D5B70;
      border-color: #BAC9D6;
      background-color: #F4F7FA;
    }

    .outline-btn.is-sync-btn:hover {
      background-color: #E7EFF5;
      border-color: #5B768A;
      color: #1E3A4C;
    }

    .core-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--border-core);
      display: inline-block;
      flex-shrink: 0;
    }

    .chip-num {
      font-size: 12.5px;
      opacity: 0.85;
      font-variant-numeric: tabular-nums;
    }

    .divider-v {
      width: 1.5px;
      height: 22px;
      background-color: var(--border-default);
      flex-shrink: 0;
    }

    /* 雙進度條區 */
    .progress-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .progress-stack {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      line-height: 1;
    }

    .progress-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 700;
      color: var(--text-secondary);
      width: 72px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .progress-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .progress-track {
      width: 195px;
      height: 9px;
      background-color: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      width: 0%;
      transition: width 0.25s ease;
    }

    .progress-stat {
      font-weight: 700;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      min-width: 96px;
      text-align: right;
      white-space: nowrap;
    }

    .reset-btn {
      padding: 6px 9px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      border: 1.5px solid transparent;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .reset-btn:hover {
      background-color: var(--bg-subtle);
      color: var(--text-strong);
      border-color: var(--border-default);
    }

    .reset-btn.is-confirm {
      background-color: var(--border-core);
      color: #FFFFFF;
      border-color: var(--border-core);
    }

    /* =========================================================================
       3. 下方左右主體 (左側 240px 固定分類欄 + 右側獨立捲動內容區)
       ========================================================================= */
    .app-body {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background-color: var(--bg-card);
      border-right: 1.5px solid var(--border-default);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 10px 10px 12px;
      gap: 10px;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cat-card-btn {
      width: 100%;
      min-height: 66px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background-color: #FFFFFF;
      border: 2px solid var(--border-strong);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      text-align: left;
      transition: all 0.16s ease;
    }

    .cat-card-btn:hover {
      background-color: #F8FAFC;
      border-color: #9CA9B8;
    }

    .cat-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
    }

    .cat-card-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      line-height: 1.25;
    }

    .cat-card-count {
      font-size: 12.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-default);
      padding: 2px 7px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .cat-card-meta {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      line-height: 1.2;
    }

    .sidebar-legend {
      margin-top: auto;
      padding: 10px 8px 2px;
      border-top: 1px solid var(--border-default);
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 12.5px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-box {
      width: 15px;
      height: 15px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .legend-tip {
      margin: 2px 0 0;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .main-scroll {
      flex: 1;
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 20px 40px;
    }

    .content-inner {
      max-width: 1460px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* 分類標題區：透明底色 + 細底線 */
    .section-header {
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-default);
      background: transparent;
    }

    .section-header h2 {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.3;
    }

    .section-header p {
      margin: 4px 0 0;
      font-size: 14.5px;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .sub-heading {
      margin: 0 0 10px;
      font-size: 14.5px;
      font-weight: 800;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }

    /* =========================================================================
       4. 卡片共用樣式 (必背粗紅框 / 已熟記柔綠底 / 遮罩點擊偷看)
       ========================================================================= */
    .card-base {
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-default);
      border-radius: var(--radius-lg);
      transition: background-color 0.16s ease, border-color 0.16s ease;
    }

    .card-base:hover {
      border-color: #B9C4D0;
    }

    .card-base.is-mastered {
      background-color: var(--bg-mastered);
      border-color: var(--border-mastered);
    }

    .card-base.is-core {
      border: 2.5px solid var(--border-core);
    }

    .card-base.is-core.is-mastered {
      background-color: var(--bg-mastered);
      border: 2.5px solid var(--border-core);
    }

    .action-btns {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1.5px solid var(--border-strong);
      background-color: #FFFFFF;
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background-color: var(--bg-subtle);
      color: var(--text-strong);
      border-color: #94A3B8;
    }

    .icon-btn.is-checked {
      background-color: var(--accent-mastered);
      border-color: var(--accent-mastered);
      color: #FFFFFF;
    }

    .icon-btn.is-speaking {
      background-color: #5B768A;
      border-color: #5B768A;
      color: #FFFFFF;
      transform: scale(1.06);
    }

    /* 遮罩模糊與點擊偷看 (.revealed 還原) */
    .mask-wrap {
      display: inline-block;
      position: relative;
      border-radius: 6px;
      max-width: 100%;
    }

    .mask-wrap.is-masked {
      cursor: pointer;
      background-color: #E2E8F0;
      padding: 1px 7px;
      user-select: none;
      transition: background-color 0.15s ease;
    }

    .mask-wrap.is-masked:hover {
      background-color: #CBD5E1;
    }

    .mask-wrap.is-masked .mask-content {
      filter: blur(6px);
      opacity: 0.25;
      pointer-events: none;
    }

    .mask-wrap.is-masked::after {
      content: attr(data-hint);
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
      pointer-events: none;
    }

    .mask-wrap.is-masked.revealed {
      background-color: transparent;
      padding: 0;
      user-select: text;
    }

    .mask-wrap.is-masked.revealed .mask-content {
      filter: none;
      opacity: 1;
      pointer-events: auto;
    }

    .mask-wrap.is-masked.revealed::after {
      display: none;
    }

    /* =========================================================================
       5. 單字卡網格：桌機 3 欄、平板 2 欄、手機 1 欄 (左右對分・三行嚴格對齊)
       ========================================================================= */
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .vocab-card {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 10px;
    }

    .vocab-left {
      width: 56%;
      min-width: 0;
      padding-right: 10px;
      border-right: 1px solid rgba(148, 163, 184, 0.35);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
    }

    .vocab-ipa {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.3;
      word-break: break-word;
    }

    .vocab-en {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-strong);
      line-height: 1.25;
      word-break: break-word;
    }

    .vocab-colloc {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.3;
      word-break: break-word;
    }

    .vocab-right {
      width: 44%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .vocab-zh {
      font-size: 17.5px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.28;
      word-break: break-word;
    }

    .vocab-note {
      margin: 4px 0 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.35;
      word-break: break-word;
    }

    .vocab-actions {
      display: flex;
      justify-content: flex-end;
    }

    /* =========================================================================
       6. 句型卡、聽力防禦卡、語氣公式卡 (桌機 2 欄，內部左右對分)
       ========================================================================= */
    .two-col-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .phrase-card {
      padding: 13px 15px;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 12px;
    }

    .phrase-left {
      width: 58%;
      min-width: 0;
      padding-right: 12px;
      border-right: 1px solid rgba(148, 163, 184, 0.35);
      display: flex;
      align-items: center;
    }

    .phrase-en {
      font-size: 17.5px;
      font-weight: 700;
      color: var(--text-strong);
      line-height: 1.45;
      word-break: break-word;
    }

    .phrase-en strong {
      color: #9A3434;
      font-weight: 800;
      text-decoration: underline;
      text-decoration-color: rgba(201, 74, 74, 0.45);
      text-underline-offset: 3px;
    }

    .phrase-right {
      width: 42%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .phrase-zh {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.4;
    }

    .phrase-note {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.38;
    }

    /* 聽力防禦 Q&A 卡片 */
    .qa-card {
      padding: 13px 15px;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 12px;
    }

    .qa-left {
      width: 58%;
      min-width: 0;
      padding-right: 12px;
      border-right: 1px solid rgba(148, 163, 184, 0.35);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }

    .qa-line {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .qa-line-body {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .role-badge {
      display: inline-block;
      align-self: flex-start;
      font-size: 12px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 5px;
    }

    .role-q {
      background-color: #E2E8F0;
      color: #334155;
    }

    .role-a {
      background-color: rgba(42, 123, 86, 0.14);
      color: #1E4E3D;
    }

    .qa-en-q {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-strong);
      line-height: 1.35;
    }

    .qa-en-a {
      font-size: 16px;
      font-weight: 700;
      color: #1E4E3D;
      line-height: 1.35;
    }

    .qa-right {
      width: 42%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .qa-zh-block {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.45;
    }

    /* 語氣公式卡片 */
    .tone-card {
      padding: 13px 15px;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 12px;
    }

    .tone-left {
      width: 56%;
      min-width: 0;
      padding-right: 12px;
      border-right: 1px solid rgba(148, 163, 184, 0.35);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .tone-formula {
      font-size: 18px;
      font-weight: 800;
      color: #5D4966;
      line-height: 1.35;
    }

    .tone-example-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      background-color: rgba(247, 248, 250, 0.9);
      border: 1px solid var(--border-default);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .tone-example {
      font-size: 15.5px;
      font-weight: 600;
      color: var(--text-strong);
      line-height: 1.4;
    }

    .tone-right {
      width: 44%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .tone-zh {
      font-size: 15.5px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.5;
    }

    /* 空狀態 */
    .empty-state {
      background-color: rgba(255, 255, 255, 0.85);
      border: 2px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 40px 20px;
      text-align: center;
    }

    .empty-state h3 {
      margin: 0;
      font-size: 17.5px;
      color: var(--text-primary);
    }

    .empty-state p {
      margin: 6px 0 14px;
      font-size: 14.5px;
      color: var(--text-muted);
    }

    .empty-btn {
      padding: 8px 16px;
      border-radius: 8px;
      background-color: #334155;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
    }

    .empty-btn:hover {
      background-color: #1E293B;
    }

    /* 底部中央 Toast 提示 */
    .toast-container {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 70;
      display: flex;
      flex-direction: column;
      align-items: center;

      // =========================================================================
      // 2. 固定順序索引與狀態管理 (171 項)
      // =========================================================================
      const STORAGE_KEY = 'us_east_english_v1';

      const ALL_ITEMS = [];
      CATEGORIES.forEach(function (cat) {
        if (cat.vocab) cat.vocab.forEach(function (x) { ALL_ITEMS.push({ id: x.id, must: !!x.must, catKey: cat.key }); });
        if (cat.phrases) cat.phrases.forEach(function (x) { ALL_ITEMS.push({ id: x.id, must: !!x.must, catKey: cat.key }); });
        if (cat.qaList) cat.qaList.forEach(function (x) { ALL_ITEMS.push({ id: x.id, must: !!x.must, catKey: cat.key }); });
        if (cat.toneList) cat.toneList.forEach(function (x) { ALL_ITEMS.push({ id: x.id, must: !!x.must, catKey: cat.key }); });
      });

      const ALL_IDS = ALL_ITEMS.map(function (item) { return item.id; });
      const CORE_IDS = ALL_ITEMS.filter(function (item) { return item.must; }).map(function (item) { return item.id; });
      const VALID_ID_SET = new Set(ALL_IDS);

      const state = {
        activeCategory: CATEGORIES[0].key,
        filterScope: 'all',     // 'all' | 'core'
        hideMastered: false,
        maskEn: false,
        maskHint: false,
        maskZh: false,
        speechRate: 1.0,
        mastered: new Set(),
        resetConfirmTimer: null
      };

      const els = {

      // =========================================================================
      // 3. 工具函式：安全存取 localStorage、HTML 轉義、Toast 提示
      // =========================================================================
      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function loadProgressFromStorage() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            state.mastered = new Set(parsed.filter(function (id) { return VALID_ID_SET.has(id); }));
          }
        } catch (err) {
          // 沙盒或隱私模式自動退回記憶體暫存
        }
      }

      function saveProgressToStorage() {
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(state.mastered)));
        } catch (err) {
          // 忽略儲存例外
        }
      }

      function showToast(message, durationMs) {
        const toast = document.createElement('div');
        toast.className = 'toast-item';
        toast.textContent = message;
        els.toastContainer.appendChild(toast);

        const stayTime = typeof durationMs === 'number' ? durationMs : 3200;
        window.setTimeout(function () {
          toast.classList.add('is-fading');
          window.setTimeout(function () {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
          }, 260);
        }, stayTime);
      }

      // =========================================================================
      // 4. 跨裝置同步：Bitset -> Uint8Array -> Base64URL (#sync=...)
      // =========================================================================
      function encodeMasteredToCode(masteredSet) {
        const byteLen = Math.ceil(ALL_IDS.length / 8);
        const bytes = new Uint8Array(byteLen);
        for (let i = 0; i < ALL_IDS.length; i++) {
          if (masteredSet.has(ALL_IDS[i])) {
            bytes[i >> 3] |= (1 << (i & 7));
          }
        }
        let binary = '';
        for (let i = 0; i < bytes.length; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary)
          .replace(/\+/g, '-')
          .replace(/\//g, '_')
          .replace(/=+$/, '');
      }

      function decodeCodeToMastered(code) {
        if (!code || typeof code !== 'string') return null;
        try {
          let b64 = code.replace(/-/g, '+').replace(/_/g, '/');
          while (b64.length % 4 !== 0) {
            b64 += '=';
          }
          const binary = atob(b64);
          const expectedLen = Math.ceil(ALL_IDS.length / 8);
          if (binary.length !== expectedLen) return null;

          const restored = new Set();
          for (let i = 0; i < ALL_IDS.length; i++) {
            const byteVal = binary.charCodeAt(i >> 3);
            if ((byteVal & (1 << (i & 7))) !== 0) {
              restored.add(ALL_IDS[i]);
            }
          }
          return restored;
        } catch (err) {
          return null;
        }
      }

      function buildSyncUrl(code) {
        const proto = window.location.protocol;
        if (proto === 'http:' || proto === 'https:') {
          return {
            url: window.location.origin + window.location.pathname + '#sync=' + code,
            isHosted: true
          };
        }
        if (proto === 'file:') {
          return {
            url: window.location.href.split('#')[0] + '#sync=' + code,
            isHosted: true
          };
        }
        return {
          url: '#sync=' + code,
          isHosted: false
        };
      }

      function copyViaExecCommand(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '-9999px';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return !!ok;
        } catch (err) {
          return false;
        }
      }

      function copyTextWithFallback(text) {
        return new Promise(function (resolve) {
          if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            navigator.clipboard.writeText(text).then(function () {
              resolve(true);
            }).catch(function () {
              resolve(copyViaExecCommand(text));
            });
          } else {
            resolve(copyViaExecCommand(text));
          }
        });
      }

      function openSyncModal(urlText, isHosted) {
        els.syncModalDesc.textContent = isHosted
          ? '請複製下方專屬同步網址，貼到其他裝置開啟即可還原進度：'
          : '目前為預覽環境，請複製下方短碼並加在您 GitHub Pages 網址後方即可同步：';
        els.syncModalInput.value = urlText;
        els.syncModalBackdrop.classList.add('is-open');
        window.setTimeout(function () {
          els.syncModalInput.focus();
          els.syncModalInput.select();
        }, 30);
      }

      function closeSyncModal() {
        els.syncModalBackdrop.classList.remove('is-open');
      }

      function handleExportSync() {
        const code = encodeMasteredToCode(state.mastered);
        const result = buildSyncUrl(code);
        copyTextWithFallback(result.url).then(function (copied) {
          if (copied) {
            showToast('已複製同步網址！在其他裝置貼上開啟即可還原進度', 3600);
          } else {
            openSyncModal(result.url, result.isHosted);
          }
        });
      }

      function checkAndApplySyncFromHash() {
        const hash = window.location.hash || '';
        if (hash.indexOf('#sync=') !== 0) return false;
        const code = hash.slice(6).split('&')[0].trim();
        const decodedSet = decodeCodeToMastered(code);
        if (!decodedSet) {
          showToast('同步短碼無效，未變更現有學習進度', 3000);
          return false;
        }

        state.mastered = decodedSet;
        saveProgressToStorage();

        try {
          if (window.history && typeof window.history.replaceState === 'function') {
            window.history.replaceState(null, '', window.location.pathname + window.location.search);
          }
        } catch (err) {
          // 忽略受限環境例外
        }

        updateAllUI();
        showToast('已成功匯入跨裝置學習進度！', 3600);
        return true;
      }

      // =========================================================================
      // 5. 美式英語真人語音朗讀引擎 (Web Speech API, en-US)
      // =========================================================================
      let preferredUsVoice = null;
      let activeSpeakBtn = null;

      function refreshEnglishVoice() {
        if (!('speechSynthesis' in window)) return;
        const voices = window.speechSynthesis.getVoices() || [];
        const usVoices = voices.filter(function (v) {
          return v.lang && v.lang.toLowerCase().replace('_', '-').indexOf('en-us') === 0;
        });
        const enVoices = usVoices.length ? usVoices : voices.filter(function (v) {
          return v.lang && v.lang.toLowerCase().indexOf('en') === 0;
        });
        if (!enVoices.length) return;

        const preferredNames = ['google us english', 'samantha', 'alex', 'aria', 'guy', 'jenny', 'zira', 'david'];
        for (let i = 0; i < preferredNames.length; i++) {
          const kw = preferredNames[i];
          const found = enVoices.find(function (v) {
            return v.name && v.name.toLowerCase().indexOf(kw) !== -1;
          });
          if (found) {
            preferredUsVoice = found;
            return;
          }
        }
        preferredUsVoice = enVoices[0];
      }

      if ('speechSynthesis' in window) {
        refreshEnglishVoice();
        if (typeof window.speechSynthesis.onvoiceschanged !== 'undefined') {
          window.speechSynthesis.onvoiceschanged = refreshEnglishVoice;
        }
      }

      function sanitizeSpeechText(rawText) {
        return String(rawText || '')
          .replace(/\[Last Name\]/gi, 'Smith')
          .replace(/\([^)]*\)/g, ' ')
          .replace(/\[[^\]]*\]/g, ' ')
          .replace(/\s*\/\s*/g, ', ')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function speakEnglish(rawText, btnEl) {
        if (!('speechSynthesis' in window)) {
          showToast('此瀏覽器不支援語音朗讀功能', 2600);
          return;
        }
        const cleaned = sanitizeSpeechText(rawText);
        if (!cleaned) return;

        try {
          window.speechSynthesis.cancel();
          if (activeSpeakBtn) {
            activeSpeakBtn.classList.remove('is-speaking');
            activeSpeakBtn = null;
          }

          const utter = new SpeechSynthesisUtterance(cleaned);
          utter.lang = 'en-US';
          utter.rate = state.speechRate;
          if (preferredUsVoice) {
            utter.voice = preferredUsVoice;
          }

          if (btnEl) {
            btnEl.classList.add('is-speaking');
            activeSpeakBtn = btnEl;
          }

          const clearState = function () {
            if (btnEl) btnEl.classList.remove('is-speaking');
            if (activeSpeakBtn === btnEl) activeSpeakBtn = null;
          };
          utter.onend = clearState;
          utter.onerror = clearState;

          window.speechSynthesis.speak(utter);
        } catch (err) {
          showToast('語音播放暫時無法啟動，請再試一次', 2400);
        }
      }

      // =========================================================================
      // 6. 遮罩渲染輔助函式 (支援點擊切換 .revealed 單獨偷看)
      // =========================================================================
      function wrapMask(innerHtml, type, hintText) {
        const masked =
          (type === 'en' && state.maskEn) ||
          (type === 'hint' && state.maskHint) ||
          (type === 'zh' && state.maskZh);

        if (!masked) {
          return innerHtml;
        }
        return (
          '<span class="mask-wrap is-masked" data-action="toggle-reveal" data-hint="' + escapeHtml(hintText) + '" title="點擊偷看答案">' +
            '<span class="mask-content">' + innerHtml + '</span>' +
          '</span>'
        );
      }

      // =========================================================================
      // 7. 介面渲染：頂部狀態、左側 7 大分類、右側高密度卡片
      // =========================================================================
      function getCategoryItems(cat) {
        const list = [];
        if (cat.vocab) cat.vocab.forEach(function (x) { list.push(x); });
        if (cat.phrases) cat.phrases.forEach(function (x) { list.push(x); });
        if (cat.qaList) cat.qaList.forEach(function (x) { list.push(x); });
        if (cat.toneList) cat.toneList.forEach(function (x) { list.push(x); });
        return list;
      }

      function filterItems(list) {
        if (!list) return [];
        return list.filter(function (item) {
          if (state.filterScope === 'core' && !item.must) return false;
          if (state.hideMastered && state.mastered.has(item.id)) return false;
          return true;
        });
      }

      function updateHeaderAndProgress() {
        els.totalAllChip.textContent = String(ALL_IDS.length);
        els.coreTotalChip.textContent = String(CORE_IDS.length);

        els.btnFilterAll.classList.toggle('is-active', state.filterScope === 'all');
        els.btnFilterCore.classList.toggle('is-core-active', state.filterScope === 'core');
        els.btnHideMastered.classList.toggle('is-hide-active', state.hideMastered);

        els.btnMaskEn.classList.toggle('is-active', state.maskEn);
        els.btnMaskHint.classList.toggle('is-active', state.maskHint);
        els.btnMaskZh.classList.toggle('is-active', state.maskZh);

        els.btnRateNormal.classList.toggle('is-rate-active', state.speechRate === 1.0);
        els.btnRateSlow.classList.toggle('is-rate-active', state.speechRate === 0.75);

        let coreDone = 0;
        for (let i = 0; i < CORE_IDS.length; i++) {
          if (state.mastered.has(CORE_IDS[i])) coreDone++;
        }
        const allDone = state.mastered.size;

        const corePct = CORE_IDS.length ? Math.round((coreDone / CORE_IDS.length) * 100) : 0;
        const allPct = ALL_IDS.length ? Math.round((allDone / ALL_IDS.length) * 100) : 0;

        els.coreProgressFill.style.width = corePct + '%';
        els.coreProgressText.textContent = coreDone + '/' + CORE_IDS.length + ' (' + corePct + '%)';

        els.allProgressFill.style.width = allPct + '%';
        els.allProgressText.textContent = allDone + '/' + ALL_IDS.length + ' (' + allPct + '%)';
      }

      function renderSidebar() {
        const html = CATEGORIES.map(function (cat) {
          const visibleCount = filterItems(getCategoryItems(cat)).length;
          const isActive = cat.key === state.activeCategory;
          const activeStyle = isActive
            ? 'border-width:2.5px;border-color:' + cat.color + ';background-color:' + cat.bgTint + ';'
            : '';

          return (
            '<button type="button" class="cat-card-btn" data-cat-key="' + escapeHtml(cat.key) + '" style="' + activeStyle + '">' +
              '<div class="cat-card-top">' +
                '<span class="cat-card-title" style="' + (isActive ? 'color:' + cat.color + ';' : '') + '">' +
                  '<span>' + cat.icon + '</span>' +
                  '<span>' + escapeHtml(cat.name) + '</span>' +
                '</span>' +
                '<span class="cat-card-count">' + visibleCount + '</span>' +
              '</div>' +
              '<span class="cat-card-meta">' + escapeHtml(cat.meta) + '</span>' +
            '</button>'
          );
        }).join('');

        els.sidebarNav.innerHTML = html;
      }

      function renderVocabCard(item) {
        const isMastered = state.mastered.has(item.id);
        const cls = 'card-base vocab-card' + (item.must ? ' is-core' : '') + (isMastered ? ' is-mastered' : '');
        const checkCls = 'icon-btn' + (isMastered ? ' is-checked' : '');

        return (
          '<article class="' + cls + '">' +
            '<div class="vocab-left">' +
              '<div class="vocab-ipa">' + wrapMask(escapeHtml(item.ipa), 'hint', '顯示音標') + '</div>' +
              '<div class="vocab-en">' + wrapMask(escapeHtml(item.en), 'en', '顯示英文') + '</div>' +
              '<div class="vocab-colloc">' + wrapMask(escapeHtml(item.colloc), 'hint', '顯示搭配詞') + '</div>' +
            '</div>' +
            '<div class="vocab-right">' +
              '<div>' +
                '<div class="vocab-zh">' + wrapMask(escapeHtml(item.zh), 'zh', '顯示中文') + '</div>' +
                (item.note ? '<p class="vocab-note">' + wrapMask(escapeHtml(item.note), 'zh', '顯示備註') + '</p>' : '') +
              '</div>' +
              '<div class="vocab-actions">' +
                '<div class="action-btns">' +
                  '<button type="button" class="icon-btn" data-action="speak" data-tts="' + escapeHtml(item.en) + '" title="朗讀美式英語發音" aria-label="朗讀英文">🔊</button>' +
                  '<button type="button" class="' + checkCls + '" data-action="toggle-mastered" data-id="' + escapeHtml(item.id) + '" title="' + (isMastered ? '取消已熟記' : '標記為已熟記') + '" aria-label="切換已熟記">✓</button>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</article>'
        );
      }

      function renderPhraseCard(item) {
        const isMastered = state.mastered.has(item.id);
        const cls = 'card-base phrase-card' + (item.must ? ' is-core' : '') + (isMastered ? ' is-mastered' : '');
        const checkCls = 'icon-btn' + (isMastered ? ' is-checked' : '');

        return (
          '<article class="' + cls + '">' +
            '<div class="phrase-left">' +
              '<div class="phrase-en">' + wrapMask(item.enHtml, 'en', '顯示英文句型') + '</div>' +
            '</div>' +
            '<div class="phrase-right">' +
              '<div>' +
                '<div class="phrase-zh">' + wrapMask(escapeHtml(item.zh), 'zh', '顯示中文翻譯') + '</div>' +
                (item.note ? '<p class="phrase-note">' + wrapMask(escapeHtml(item.note), 'zh', '顯示備註') + '</p>' : '') +
              '</div>' +
              '<div class="vocab-actions">' +
                '<div class="action-btns">' +
                  '<button type="button" class="icon-btn" data-action="speak" data-tts="' + escapeHtml(item.tts) + '" title="朗讀完整句型" aria-label="朗讀句型">🔊</button>' +
                  '<button type="button" class="' + checkCls + '" data-action="toggle-mastered" data-id="' + escapeHtml(item.id) + '" title="' + (isMastered ? '取消已熟記' : '標記為已熟記') + '" aria-label="切換已熟記">✓</button>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</article>'
        );
      }

      function renderQaCard(item) {
        const isMastered = state.mastered.has(item.id);
        const cls = 'card-base qa-card' + (item.must ? ' is-core' : '') + (isMastered ? ' is-mastered' : '');
        const checkCls = 'icon-btn' + (isMastered ? ' is-checked' : '');

        return (
          '<article class="' + cls + '">' +
            '<div class="qa-left">' +
              '<div class="qa-line">' +
                '<div class="qa-line-body">' +
                  '<span class="role-badge role-q">對方問</span>' +
                  '<div class="qa-en-q">' + wrapMask(escapeHtml(item.q), 'en', '顯示對方提問') + '</div>' +
                '</div>' +
                '<button type="button" class="icon-btn" data-action="speak" data-tts="' + escapeHtml(item.q) + '" title="聽對方提問" aria-label="朗讀對方提問">🔊</button>' +
              '</div>' +
              '<div class="qa-line">' +
                '<div class="qa-line-body">' +
                  '<span class="role-badge role-a">自然回</span>' +
                  '<div class="qa-en-a">' + wrapMask(escapeHtml(item.a), 'en', '顯示建議回應') + '</div>' +
                '</div>' +
                '<button type="button" class="icon-btn" data-action="speak" data-tts="' + escapeHtml(item.a) + '" title="朗讀建議回應" aria-label="朗讀建議回應">🔊</button>' +
              '</div>' +
            '</div>' +
            '<div class="qa-right">' +
              '<div>' +
                '<div class="qa-zh-block">' + wrapMask(escapeHtml(item.zh), 'zh', '顯示中文對照') + '</div>' +
                (item.note ? '<p class="phrase-note">' + wrapMask(escapeHtml(item.note), 'zh', '顯示實戰備註') + '</p>' : '') +
              '</div>' +
              '<div class="vocab-actions">' +
                '<button type="button" class="' + checkCls + '" data-action="toggle-mastered" data-id="' + escapeHtml(item.id) + '" title="' + (isMastered ? '取消已熟記' : '標記為已熟記') + '" aria-label="切換已熟記">✓</button>' +
              '</div>' +
            '</div>' +
          '</article>'
        );
      }

      function renderToneCard(item) {
        const isMastered = state.mastered.has(item.id);
        const cls = 'card-base tone-card' + (item.must ? ' is-core' : '') + (isMastered ? ' is-mastered' : '');
        const checkCls = 'icon-btn' + (isMastered ? ' is-checked' : '');

        return (
          '<article class="' + cls + '">' +
            '<div class="tone-left">' +
              '<div class="tone-formula">' + wrapMask(escapeHtml(item.formula), 'en', '顯示語氣公式') + '</div>' +
              '<div class="tone-example-row">' +
                '<div class="tone-example">' + wrapMask(escapeHtml(item.example), 'en', '顯示英文例句') + '</div>' +
                '<button type="button" class="icon-btn" data-action="speak" data-tts="' + escapeHtml(item.example) + '" title="朗讀例句" aria-label="朗讀例句">🔊</button>' +
              '</div>' +
            '</div>' +
            '<div class="tone-right">' +
              '<div class="tone-zh">' + wrapMask(escapeHtml(item.zh), 'zh', '顯示中文解說') + '</div>' +
              '<div class="vocab-actions">' +
                '<button type="button" class="' + checkCls + '" data-action="toggle-mastered" data-id="' + escapeHtml(item.id) + '" title="' + (isMastered ? '取消已熟記' : '標記為已熟記') + '" aria-label="切換已熟記">✓</button>' +
              '</div>' +
            '</div>' +
          '</article>'
        );
      }

      function renderMainContent() {
        const cat = CATEGORIES.find(function (c) { return c.key === state.activeCategory; }) || CATEGORIES[0];
        const parts = [];

        parts.push(
          '<header class="section-header">' +
            '<h2><span>' + cat.icon + '</span><span>' + escapeHtml(cat.name) + '</span></h2>' +
            '<p>' + escapeHtml(cat.subtitle) + '</p>' +
          '</header>'
        );

        let visibleTotal = 0;

        if (cat.vocab) {
          const filteredVocab = filterItems(cat.vocab);
          visibleTotal += filteredVocab.length;
          if (filteredVocab.length) {
            parts.push(
              '<section>' +
                '<h3 class="sub-heading">核心單字與片語（' + filteredVocab.length + '）</h3>' +
                '<div class="vocab-grid">' + filteredVocab.map(renderVocabCard).join('') + '</div>' +
              '</section>'
            );
          }
        }

        if (cat.phrases) {
          const filteredPhrases = filterItems(cat.phrases);
          visibleTotal += filteredPhrases.length;
          if (filteredPhrases.length) {
            parts.push(
              '<section>' +
                '<h3 class="sub-heading">實戰句型（' + filteredPhrases.length + '）</h3>' +
                '<div class="two-col-grid">' + filteredPhrases.map(renderPhraseCard).join('') + '</div>' +
              '</section>'
            );
          }
        }

        if (cat.qaList) {
          const filteredQa = filterItems(cat.qaList);
          visibleTotal += filteredQa.length;
          if (filteredQa.length) {
            parts.push(
              '<section>' +
                '<h3 class="sub-heading">美式聽力防禦 Q&amp;A（' + filteredQa.length + '）</h3>' +
                '<div class="two-col-grid">' + filteredQa.map(renderQaCard).join('') + '</div>' +
              '</section>'
            );
          }
        }

        if (cat.toneList) {
          const filteredTone = filterItems(cat.toneList);
          visibleTotal += filteredTone.length;
          if (filteredTone.length) {
            parts.push(
              '<section>' +
                '<h3 class="sub-heading">道地美式禮貌語氣公式（' + filteredTone.length + '）</h3>' +
                '<div class="two-col-grid">' + filteredTone.map(renderToneCard).join('') + '</div>' +
              '</section>'
            );
          }
        }

        if (visibleTotal === 0) {
          parts.push(
            '<div class="empty-state">' +
              '<h3>這個分類在目前篩選條件下已全部完成！</h3>' +
              '<p>您可以切換左側其他分類，或取消「隱藏已熟記／必背」篩選檢視完整內容。</p>' +
              '<button type="button" class="empty-btn" data-action="clear-filters">顯示本分類全部卡片</button>' +
            '</div>'
          );
        }

        els.contentContainer.innerHTML = parts.join('');
      }

      function updateAllUI() {
        updateHeaderAndProgress();
        renderSidebar();
        renderMainContent();
      }

      // =========================================================================
      // 8. 事件綁定與事件委派
      // =========================================================================
      els.btnFilterAll.addEventListener('click', function () {
        state.filterScope = 'all';
        updateAllUI();
      });

      els.btnFilterCore.addEventListener('click', function () {
        state.filterScope = 'core';
        updateAllUI();
      });

      els.btnHideMastered.addEventListener('click', function () {
        state.hideMastered = !state.hideMastered;
        updateAllUI();
      });

      els.btnMaskEn.addEventListener('click', function () {
        state.maskEn = !state.maskEn;
        updateAllUI();
      });

      els.btnMaskHint.addEventListener('click', function () {
        state.maskHint = !state.maskHint;
        updateAllUI();
      });

      els.btnMaskZh.addEventListener('click', function () {
        state.maskZh = !state.maskZh;
        updateAllUI();
      });

      els.btnRateNormal.addEventListener('click', function () {
        state.speechRate = 1.0;
        updateHeaderAndProgress();
      });

      els.btnRateSlow.addEventListener('click', function () {
        state.speechRate = 0.75;
        updateHeaderAndProgress();
      });

      els.btnSyncProgress.addEventListener('click', handleExportSync);

      // 兩段式安全重置（不使用原生 confirm）
      els.btnResetProgress.addEventListener('click', function () {
        if (!els.btnResetProgress.classList.contains('is-confirm')) {
          els.btnResetProgress.classList.add('is-confirm');
          els.btnResetProgress.textContent = '確定重置？';
          state.resetConfirmTimer = window.setTimeout(function () {
            els.btnResetProgress.classList.remove('is-confirm');
            els.btnResetProgress.textContent = '重置';
          }, 3000);
          return;
        }

        if (state.resetConfirmTimer) {
          window.clearTimeout(state.resetConfirmTimer);
          state.resetConfirmTimer = null;
        }
        els.btnResetProgress.classList.remove('is-confirm');
        els.btnResetProgress.textContent = '重置';
        state.mastered.clear();
        saveProgressToStorage();
        updateAllUI();
        showToast('已清空所有熟記進度紀錄', 2600);
      });

      // 左側 7 大分類切換
      els.sidebarNav.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-cat-key]');
        if (!btn) return;
        const nextKey = btn.getAttribute('data-cat-key');
        if (nextKey && nextKey !== state.activeCategory) {
          state.activeCategory = nextKey;
          updateAllUI();
          els.mainScrollArea.scrollTop = 0;
        }
      });

      // 右側主內容區事件委派（發音 / 熟記 / 單獨偷看 / 清除篩選）
      els.contentContainer.addEventListener('click', function (e) {
        const target = e.target.closest('[data-action]');
        if (!target) return;

        const action = target.getAttribute('data-action');
        if (action === 'speak') {
          const ttsText = target.getAttribute('data-tts');
          if (ttsText) speakEnglish(ttsText, target);
          return;
        }

        if (action === 'toggle-mastered') {
          const id = target.getAttribute('data-id');
          if (!id) return;
          if (state.mastered.has(id)) {
            state.mastered.delete(id);
          } else {
            state.mastered.add(id);
          }
          saveProgressToStorage();
          updateAllUI();
          return;
        }

        if (action === 'toggle-reveal') {
          target.classList.toggle('revealed');
          return;
        }

        if (action === 'clear-filters') {
          state.filterScope = 'all';
          state.hideMastered = false;
          updateAllUI();
        }
      });

      // 備援複製視窗事件
      els.btnSyncModalCopy.addEventListener('click', function () {
        els.syncModalInput.focus();
        els.syncModalInput.select();
        const ok = copyViaExecCommand(els.syncModalInput.value);
        if (ok) {
          closeSyncModal();
          showToast('已複製同步網址！在其他裝置貼上開啟即可還原進度', 3400);
        }
      });

      els.btnSyncModalClose.addEventListener('click', closeSyncModal);
      els.syncModalBackdrop.addEventListener('click', function (e) {
        if (e.target === els.syncModalBackdrop) closeSyncModal();
      });

      window.addEventListener('hashchange', checkAndApplySyncFromHash);

      // =========================================================================
      // 9. 初始化啟動
      // =========================================================================
      function init() {
        loadProgressFromStorage();
        const loadedFromSync = checkAndApplySyncFromHash();
        if (!loadedFromSync) {
          updateAllUI();
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
