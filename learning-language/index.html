<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>語言學習中心｜蘇的工具箱 / SU's TOOLBOX</title>
  <!-- Google Fonts: Noto Sans TC, IBM Plex Mono & Google Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,450,0,0" />
  <link rel="stylesheet" href="../assets/css/dashboard.css" />
</head>
<body>

  <!-- ── 頂部深藍專業儀表板導覽列 ─────────────────────── -->
  <header class="portal-header">
    <div class="header-inner">
      <div class="brand-group">
        <div class="brand-logo" aria-hidden="true">
          <span class="material-symbols-outlined">translate</span>
        </div>
        <div class="brand-titles">
          <span class="eyebrow">SU's TOOLBOX / SUB-TOPIC HUB</span>
          <h1>
            <span>語言學習中心</span>
            <span class="en-sub">/ LANGUAGE HUB</span>
          </h1>
        </div>
      </div>

      <div class="header-actions">
        <a href="../" class="header-btn">
          <span class="material-symbols-outlined">arrow_back</span>
          <span>返回蘇的工具箱首頁</span>
        </a>
      </div>
    </div>
  </header>

  <!-- ── 主內容區：次主題選擇卡片 ─────────────────────── -->
  <main class="portal-main">
    <nav class="breadcrumb-bar" aria-label="麵包屑導覽">
      <a href="../">
        <span class="material-symbols-outlined" style="font-size:16px;">home</span>
        <span>蘇的工具箱 (SU's TOOLBOX)</span>
      </a>
      <span>/</span>
      <span>語言學習中心 (learning-language)</span>
    </nav>

    <section class="toolbar-panel" aria-label="語言主題篩選與搜尋">
      <div id="category-tabs" class="category-tabs"></div>
      <div class="search-box">
        <span class="material-symbols-outlined">search</span>
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="搜尋日文、英文或會話情境..."
          aria-label="搜尋語言主題"
        />
      </div>
    </section>

    <section id="cards-grid" class="cards-grid" data-config-url="./topics.json" aria-live="polite">
      <!-- 由 ../assets/js/portal.js 讀取 ./topics.json 安全渲染 -->
    </section>
  </main>

  <!-- ── 頁尾資訊 ─────────────────────── -->
  <footer class="portal-footer">
    <div class="footer-inner">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span class="security-pill">
          <span class="material-symbols-outlined">library_books</span>
          <span>擴充提示：編輯 learning-language/topics.json 即可新增更多語言主題卡片</span>
        </span>
        <span id="tool-count-badge" style="font-family:var(--font-mono);font-size:12px;"></span>
      </div>
      <div>
        <a href="../" style="color:var(--accent-primary);text-decoration:none;font-weight:600;">← 返回蘇的工具箱總覽</a>
      </div>
    </div>
  </footer>

  <script src="../assets/js/portal.js"></script>
</body>
</html>
