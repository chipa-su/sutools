<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>冬季旅遊日文實戰手冊</title>
  <style>
    /* =========================================================================
       1. 設計系統變數與基礎重置 (低明度莫蘭迪日系清爽風・老花眼友善高對比)
       ========================================================================= */
    :root {
      --bg-page: #F7F8FA;
      --bg-card: #FFFFFF;
      --bg-subtle: #F1F4F8;
      --bg-mastered: #D6F0E0;
      --border-default: #DCE2EA;
      --border-strong: #CBD5E1;
      --border-core: #C94A4A;
      --border-mastered: #7CC49B;
      --accent-mastered: #2A7B56;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --text-muted: #475569;
      --sidebar-width: 240px;
      --radius-md: 10px;
      --radius-lg: 12px;
      --font-sans: "PingFang TC", "Microsoft JhengHei", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-jp: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "Noto Sans JP", sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      color: inherit;
    }

    /* =========================================================================
       2. 全視窗雙區固定骨架 (Header 固定 + Sidebar 固定 + Main 獨立捲動)
       ========================================================================= */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .app-header {
      flex-shrink: 0;
      display: flex;
      align-items: stretch;
      background-color: var(--bg-card);
      border-bottom: 1.5px solid var(--border-default);
      z-index: 30;
    }

    .header-brand {
      width: var(--sidebar-width);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 8px;
      border-right: 1.5px solid var(--border-default);
    }

    .header-brand h1 {
      margin: 0;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text-primary);
      line-height: 1.2;
      white-space: nowrap;
    }

    .header-controls-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 12px;
      padding: 8px 14px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .seg-group {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background-color: var(--bg-subtle);
      border: 1.5px solid var(--border-default);
      border-radius: 9px;
      padding: 3px;
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-secondary);
      white-space: nowrap;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .ctrl-btn:hover {
      background-color: #E2E8F0;
      color: var(--text-primary);
    }

    .ctrl-btn.is-active {
      background-color: #334155;
      color: #FFFFFF;
    }

    .ctrl-btn.is-core-active {
      background-color: #FFFFFF;
      color: var(--border-core);
      box-shadow: inset 0 0 0 1.5px var(--border-core);
    }

    .ctrl-btn.is-rate-active {
      background-color: #4B6B82;
      color: #FFFFFF;
    }

    .outline-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      background-color: #FFFFFF;
      color: var(--text-secondary);
      border: 1.5px solid var(--border-strong);
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .outline-btn:hover {
      background-color: var(--bg-subtle);
      color: var(--text-primary);
    }

    .outline-btn.is-active {
      background-color: #334155;
      border-color: #334155;
      color: #FFFFFF;
    }

    .outline-btn.is-hide-active {
      background-color: #2A7B56;
      border-color: #2A7B56;
      color: #FFFFFF;
    }

    .outline-btn.is-sync-btn {
      color: #3B5B72;
      border-color: #B4C4D1;
      background-color: #F4F7FA;
    }

    .outline-btn.is-sync-btn:hover {
      background-color: #E6EEF4;
      border-color: #4B6B82;
      color: #1E3A4C;
    }

    .core-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: var(--border-core);
      display: inline-block;
      flex-shrink: 0;
    }

    .chip-num {
      font-size: 12.5px;
      opacity: 0.85;
      font-variant-numeric: tabular-nums;
    }

    .divider-v {
      width: 1.5px;
      height: 22px;
      background-color: var(--border-default);
      flex-shrink: 0;
    }

    /* 雙進度條區 */
    .progress-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .progress-stack {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      line-height: 1;
    }

    .progress-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 700;
      color: var(--text-secondary);
      width: 72px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .progress-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .progress-track {
      width: 195px;
      height: 9px;
      background-color: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      width: 0%;
      transition: width 0.25s ease;
    }

    .progress-stat {
      font-weight: 700;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      min-width: 92px;
      text-align: right;
      white-space: nowrap;
    }

    .reset-btn {
      padding: 6px 9px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      border: 1.5px solid transparent;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .reset-btn:hover {
      background-color: var(--bg-subtle);
      color: var(--text-primary);
      border-color: var(--border-default);
    }

    .reset-btn.is-confirm {
      background-color: var(--border-core);
      color: #FFFFFF;
      border-color: var(--border-core);
    }

    /* =========================================================================
       3. 下方左右主體 (左側固定分類欄 + 右側獨立捲動內容區)
       ========================================================================= */
    .app-body {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background-color: var(--bg-card);
      border-right: 1.5px solid var(--border-default);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 12px 10px;
      gap: 10px;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cat-card-btn {
      width: 100%;
      min-height: 74px;
      padding: 12px 13px;
      border-radius: 11px;
      background-color: #FFFFFF;
      border: 2px solid var(--border-strong);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      text-align: left;
      transition: all 0.16s ease;
    }

    .cat-card-btn:hover {
      background-color: #F8FAFC;
      border-color: #94A3B8;
    }

    .cat-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
    }

    .cat-card-title {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      line-height: 1.25;
    }

    .cat-card-count {
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-default);
      padding: 2px 7px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .cat-card-meta {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      line-height: 1.2;
    }

    .sidebar-legend {
      margin-top: auto;
      padding: 12px 10px 4px;
      border-top: 1.5px solid var(--border-default);
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .legend-tip {
      margin: 2px 0 0;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .main-scroll {
      flex: 1;
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 18px 36px;
    }

    .content-inner {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-header {
      padding-bottom: 10px;
      border-bottom: 1.5px solid var(--border-default);
      background: transparent;
    }

    .section-header h2 {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.3;
    }

    .section-header p {
      margin: 4px 0 0;
      font-size: 14.5px;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .sub-heading {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 800;
      color: var(--text-secondary);
      letter-spacing: 0.03em;
    }

    /* =========================================================================
       4. 卡片共用樣式 (必背粗紅框 / 已熟記柔綠底 / 遮罩偷看 / 發音與勾選)
       ========================================================================= */
    .card-base {
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-default);
      border-radius: var(--radius-lg);
      transition: background-color 0.16s ease, border-color 0.16s ease;
    }

    .card-base:hover {
      border-color: #B8C4D4;
    }

    .card-base.is-mastered {
      background-color: var(--bg-mastered);
      border-color: var(--border-mastered);
    }

    .card-base.is-core {
      border: 2.5px solid var(--border-core);
    }

    .card-base.is-core.is-mastered {
      background-color: var(--bg-mastered);
      border: 2.5px solid var(--border-core);
    }

    .action-btns {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1.5px solid var(--border-strong);
      background-color: #FFFFFF;
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background-color: var(--bg-subtle);
      color: var(--text-primary);
      border-color: #94A3B8;
    }

    .icon-btn.is-checked {
      background-color: var(--accent-mastered);
      border-color: var(--accent-mastered);
      color: #FFFFFF;
    }

    .icon-btn.is-speaking {
      background-color: #4B6B82;
      border-color: #4B6B82;
      color: #FFFFFF;
      transform: scale(1.06);
    }

    /* 遮罩色塊 */
    .mask-btn {
      display: inline-block;
      position: relative;
      text-align: left;
      border-radius: 6px;
      padding: 1px 7px;
      background-color: #DDE4EE;
      color: transparent;
      user-select: none;
      max-width: 100%;
      vertical-align: middle;
      transition: background-color 0.15s ease;
    }

    .mask-btn:hover {
      background-color: #CBD5E1;
    }

    .mask-blur {
      filter: blur(5px);
      opacity: 0.35;
      pointer-events: none;
    }

    .mask-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      white-space: nowrap;
      pointer-events: none;
    }

    /* =========================================================================
       5. 單字卡網格：桌機一列三張・精簡留白・老花眼放大字體
       ========================================================================= */
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .vocab-card {
      padding: 9px 11px;
      display: flex;
      align-items: stretch;
      gap: 9px;
    }

    .vocab-left {
      width: 56%;
      min-width: 0;
      padding-right: 8px;
      border-right: 1px solid rgba(148, 163, 184, 0.38);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .vocab-kana {
      font-family: var(--font-jp);
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-secondary);
      line-height: 1.25;
      word-break: break-word;
    }

    .vocab-ja {
      font-family: var(--font-jp);
      font-size: 20px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.25;
      word-break: break-word;
    }

    .vocab-romaji {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-muted);
      line-height: 1.25;
      word-break: break-word;
    }

    .vocab-right {
      width: 44%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .vocab-zh {
      font-size: 17.5px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.25;
      word-break: break-word;
    }

    .vocab-note {
      margin: 3px 0 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .vocab-actions {
      display: flex;
      justify-content: flex-end;
    }

    /* =========================================================================
       6. 句型卡、店員聽力卡、動詞文法卡 (橫向雙欄精簡高度)
       ========================================================================= */
    .stack-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .sentence-card {
      padding: 11px 14px;
      display: grid;
      grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
      gap: 12px;
      align-items: center;
    }

    .sentence-left {
      padding-right: 12px;
      border-right: 1px solid rgba(148, 163, 184, 0.38);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .sentence-scene {
      font-size: 13.5px;
      font-weight: 800;
      line-height: 1.3;
    }

    .sentence-kana {
      font-family: var(--font-jp);
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-secondary);
      line-height: 1.35;
    }

    .sentence-ja {
      font-family: var(--font-jp);
      font-size: 18.5px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.35;
    }

    .sentence-romaji {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .sentence-right {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .sentence-zh {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.35;
    }

    .sentence-tip {
      margin: 4px 0 0;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .listening-card {
      padding: 12px 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
      align-items: stretch;
    }

    .listening-col {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .listening-col.clerk-col {
      padding-right: 14px;
      border-right: 1px solid rgba(148, 163, 184, 0.38);
    }

    .listening-body {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 2px;
    }

    .role-badge {
      font-size: 12.5px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .role-clerk {
      background-color: #E2E8F0;
      color: #334155;
    }

    .role-reply {
      background-color: rgba(78, 115, 99, 0.16);
      color: #2D5242;
    }

    .scene-tag {
      font-size: 13.5px;
      font-weight: 800;
      color: #8F7343;
    }

    .qa-ja {
      font-family: var(--font-jp);
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.35;
    }

    .qa-zh {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 2px;
    }

    .grammar-card {
      padding: 13px 15px;
      display: grid;
      grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
      gap: 15px;
      align-items: stretch;
    }

    .grammar-left {
      padding-right: 15px;
      border-right: 1px solid rgba(148, 163, 184, 0.38);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .grammar-title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .grammar-badge {
      font-size: 12.5px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 6px;
      background-color: rgba(69, 110, 115, 0.15);
      color: #2E5257;
    }

    .grammar-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .grammar-meaning {
      font-size: 15px;
      font-weight: 700;
      color: #456E73;
    }

    .formula-box {
      display: inline-block;
      align-self: flex-start;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-default);
      border-radius: 8px;
      padding: 5px 11px;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .formula-del {
      text-decoration: line-through;
      color: var(--border-core);
      font-weight: 800;
    }

    .formula-hl {
      color: #36595D;
      font-weight: 800;
    }

    .formula-hl-warm {
      color: #8F7343;
      font-weight: 800;
    }

    .example-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .example-item {
      background-color: rgba(248, 250, 252, 0.92);
      border: 1px solid var(--border-default);
      border-radius: 9px;
      padding: 8px 11px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .grammar-right {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .grammar-right-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .grammar-note-title {
      font-size: 15px;
      font-weight: 800;
      color: #36595D;
    }

    .grammar-notes {
      margin: 0;
      padding-left: 19px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14.5px;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    .empty-state {
      background-color: rgba(255, 255, 255, 0.8);
      border: 2px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 40px 20px;
      text-align: center;
    }

    .empty-state h3 {
      margin: 0;
      font-size: 17px;

      // =========================================================================
      // 2. 固定順序索引、狀態管理與本機儲存 (含跨裝置 Bitmask 編解碼)
      // =========================================================================
      const STORAGE_KEY = 'jp_winter_tokyo_karuizawa_v1';

      // 建立固定順序的所有項目清單（用於 bitmask 同步編碼與進度統計）
      const ALL_ITEMS = [];
      CATEGORIES.forEach(function (cat) {
        if (cat.vocab) cat.vocab.forEach(function (item) { ALL_ITEMS.push({ id: item.id, core: !!item.core, catKey: cat.key }); });
        if (cat.sentences) cat.sentences.forEach(function (item) { ALL_ITEMS.push({ id: item.id, core: !!item.core, catKey: cat.key }); });
        if (cat.qaList) cat.qaList.forEach(function (item) { ALL_ITEMS.push({ id: item.id, core: !!item.core, catKey: cat.key }); });
        if (cat.patterns) cat.patterns.forEach(function (item) { ALL_ITEMS.push({ id: item.id, core: !!item.core, catKey: cat.key }); });
      });

      const ALL_IDS = ALL_ITEMS.map(function (item) { return item.id; });
      const CORE_IDS = ALL_ITEMS.filter(function (item) { return item.core; }).map(function (item) { return item.id; });
      const VALID_ID_SET = new Set(ALL_IDS);

      const state = {
        activeCategory: CATEGORIES[0].key,
        filterScope: 'all',     // 'all' | 'core'
        hideMastered: false,
        maskJa: false,
        maskRomaji: false,
        maskZh: false,
        speechRate: 1.0,
        mastered: new Set(),
        revealedKeys: new Set(), // 記錄遮罩狀態下被單獨點擊偷看的區塊
        resetConfirmTimer: null
      };

      // DOM 元素參照
      const els = {
        btnFilterAll: document.getElementById('btnFilterAll'),
        btnFilterCore: document.getElementById('btnFilterCore'),
        totalAllChip: document.getElementById('totalAllChip'),
        coreTotalChip: document.getElementById('coreTotalChip'),
        btnHideMastered: document.getElementById('btnHideMastered'),
        btnMaskJa: document.getElementById('btnMaskJa'),
        btnMaskRomaji: document.getElementById('btnMaskRomaji'),
        btnMaskZh: document.getElementById('btnMaskZh'),
        btnRateNormal: document.getElementById('btnRateNormal'),
        btnRateSlow: document.getElementById('btnRateSlow'),
        btnSyncProgress: document.getElementById('btnSyncProgress'),
        coreProgressFill: document.getElementById('coreProgressFill'),
        coreProgressText: document.getElementById('coreProgressText'),
        allProgressFill: document.getElementById('allProgressFill'),
        allProgressText: document.getElementById('allProgressText'),
        btnResetProgress: document.getElementById('btnResetProgress'),
        sidebarNav: document.getElementById('sidebarNav'),
        mainScrollArea: document.getElementById('mainScrollArea'),
        contentContainer: document.getElementById('contentContainer'),
        toastContainer: document.getElementById('toastContainer'),
        syncModalBackdrop: document.getElementById('syncModalBackdrop'),
        syncModalDesc: document.getElementById('syncModalDesc'),
        syncModalInput: document.getElementById('syncModalInput'),
        btnSyncModalCopy: document.getElementById('btnSyncModalCopy'),
        btnSyncModalClose: document.getElementById('btnSyncModalClose')
      };

      // =========================================================================
      // 3. 工具函式：安全存取 localStorage、HTML 轉義、Toast 浮動提示
      // =========================================================================
      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function loadProgressFromStorage() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            state.mastered = new Set(parsed.filter(function (id) { return VALID_ID_SET.has(id); }));
          }
        } catch (err) {
          // 忽略沙盒或無痕模式 localStorage 例外
        }
      }

      function saveProgressToStorage() {
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(state.mastered)));
        } catch (err) {
          // 忽略儲存例外
        }
      }

      function showToast(message, durationMs) {
        const toast = document.createElement('div');
        toast.className = 'toast-item';
        toast.textContent = message;
        els.toastContainer.appendChild(toast);

        const stayTime = typeof durationMs === 'number' ? durationMs : 3000;
        window.setTimeout(function () {
          toast.classList.add('is-fading');
          window.setTimeout(function () {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
          }, 260);
        }, stayTime);
      }

      // =========================================================================
      // 4. 跨裝置同步：Bitmask + Base64URL 編解碼與剪貼簿處理
      // =========================================================================
      function encodeMasteredToCode(masteredSet) {
        const byteLen = Math.ceil(ALL_IDS.length / 8);
        const bytes = new Uint8Array(byteLen);
        for (let i = 0; i < ALL_IDS.length; i++) {
          if (masteredSet.has(ALL_IDS[i])) {
            bytes[i >> 3] |= (1 << (i & 7));
          }
        }
        let binary = '';
        for (let i = 0; i < bytes.length; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary)
          .replace(/\+/g, '-')
          .replace(/\//g, '_')
          .replace(/=+$/, '');
      }

      function decodeCodeToMastered(code) {
        if (!code || typeof code !== 'string') return null;
        try {
          let b64 = code.replace(/-/g, '+').replace(/_/g, '/');
          while (b64.length % 4 !== 0) {
            b64 += '=';
          }
          const binary = atob(b64);
          const expectedLen = Math.ceil(ALL_IDS.length / 8);
          if (binary.length !== expectedLen) return null;

          const restored = new Set();
          for (let i = 0; i < ALL_IDS.length; i++) {
            const byteVal = binary.charCodeAt(i >> 3);
            if ((byteVal & (1 << (i & 7))) !== 0) {
              restored.add(ALL_IDS[i]);
            }
          }
          return restored;
        } catch (err) {
          return null;
        }
      }

      function buildSyncUrl(code) {
        const proto = window.location.protocol;
        if (proto === 'http:' || proto === 'https:') {
          return {
            url: window.location.origin + window.location.pathname + '#sync=' + code,
            isHosted: true
          };
        }
        if (proto === 'file:') {
          return {
            url: window.location.href.split('#')[0] + '#sync=' + code,
            isHosted: true
          };
        }
        // 預覽沙盒 (about:srcdoc / blob:) 環境提供可直接附加於網址尾端的短碼
        return {
          url: '#sync=' + code,
          isHosted: false
        };
      }

      function copyTextWithFallback(text) {
        return new Promise(function (resolve) {
          if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            navigator.clipboard.writeText(text).then(function () {
              resolve(true);
            }).catch(function () {
              resolve(copyViaExecCommand(text));
            });
          } else {
            resolve(copyViaExecCommand(text));
          }
        });
      }

      function copyViaExecCommand(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '-9999px';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return !!ok;
        } catch (err) {
          return false;
        }
      }

      function openSyncModal(urlText, isHosted) {
        els.syncModalDesc.textContent = isHosted
          ? '瀏覽器限制自動複製，請複製下方專屬同步網址並貼到其他裝置開啟：'
          : '目前為離線預覽環境，請複製下方同步短碼並加在您 GitHub 網頁網址後方：';
        els.syncModalInput.value = urlText;
        els.syncModalBackdrop.classList.add('is-open');
        window.setTimeout(function () {
          els.syncModalInput.focus();
          els.syncModalInput.select();
        }, 30);
      }

      function closeSyncModal() {
        els.syncModalBackdrop.classList.remove('is-open');
      }

      function handleExportSync() {
        const code = encodeMasteredToCode(state.mastered);
        const result = buildSyncUrl(code);
        const count = state.mastered.size;

        copyTextWithFallback(result.url).then(function (copied) {
          if (copied) {
            if (result.isHosted) {
              showToast('✅ 已複製同步網址（共 ' + count + ' 項已熟記），在其他裝置貼上開啟即可同步', 3600);
            } else {
              showToast('✅ 已複製同步短碼 ' + result.url + '（共 ' + count + ' 項已熟記），貼在您的網頁網址後方即可同步', 4000);
            }
          } else {
            openSyncModal(result.url, result.isHosted);
          }
        });
      }

      function checkAndApplySyncFromHash() {
        const hash = window.location.hash || '';
        const match = hash.match(/sync=([A-Za-z0-9_-]+)/);
        if (!match) return false;

        const code = match[1];
        const decodedSet = decodeCodeToMastered(code);
        if (!decodedSet) {
          showToast('⚠️ 同步短碼格式無效，未變更現有進度', 3200);
          return false;
        }

        state.mastered = decodedSet;
        saveProgressToStorage();

        // 清除網址列中的 #sync=... 保持網址整潔
        try {
          if (window.history && typeof window.history.replaceState === 'function') {
            const cleanUrl = window.location.pathname + window.location.search;
            window.history.replaceState(null, '', cleanUrl);
          }
        } catch (err) {
          // 忽略受限環境 replaceState 例外
        }

        updateAllUI();
        showToast('✅ 已從同步網址載入 ' + decodedSet.size + ' 項熟記進度！', 3600);
        return true;
      }

      // =========================================================================
      // 5. 純日語真人發音引擎 (Web Speech API, ja-JP)
      // =========================================================================
      let preferredJaVoice = null;
      let activeSpeakBtn = null;

      function refreshJapaneseVoice() {
        if (!('speechSynthesis' in window)) return;
        const voices = window.speechSynthesis.getVoices() || [];
        const jaVoices = voices.filter(function (v) {
          return v.lang && v.lang.toLowerCase().indexOf('ja') === 0;
        });
        if (!jaVoices.length) return;

        // 優先選擇自然度高的日語語音
        const priorityKeywords = ['google', 'kyoko', 'o-ren', 'otoya', 'nanami', 'haruka', 'ayumi'];
        for (let i = 0; i < priorityKeywords.length; i++) {
          const kw = priorityKeywords[i];
          const found = jaVoices.find(function (v) {
            return v.name && v.name.toLowerCase().indexOf(kw) !== -1;
          });
          if (found) {
            preferredJaVoice = found;
            return;
          }
        }
        preferredJaVoice = jaVoices[0];
      }

      if ('speechSynthesis' in window) {
        refreshJapaneseVoice();
        if (typeof window.speechSynthesis.onvoiceschanged !== 'undefined') {
          window.speechSynthesis.onvoiceschanged = refreshJapaneseVoice;
        }
      }

      function speakJapanese(text, btnEl) {
        if (!('speechSynthesis' in window)) {
          showToast('⚠️ 此瀏覽器不支援日語語音朗讀功能', 2600);
          return;
        }
        try {
          window.speechSynthesis.cancel();
          if (activeSpeakBtn) {
            activeSpeakBtn.classList.remove('is-speaking');
            activeSpeakBtn = null;
          }

          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'ja-JP';
          utter.rate = state.speechRate;
          if (preferredJaVoice) {
            utter.voice = preferredJaVoice;
          }

          if (btnEl) {
            btnEl.classList.add('is-speaking');
            activeSpeakBtn = btnEl;
          }

          const clearSpeakingState = function () {
            if (btnEl) btnEl.classList.remove('is-speaking');
            if (activeSpeakBtn === btnEl) activeSpeakBtn = null;
          };
          utter.onend = clearSpeakingState;
          utter.onerror = clearSpeakingState;

          window.speechSynthesis.speak(utter);
        } catch (err) {
          showToast('⚠️ 語音播放暫時無法啟動，請再試一次', 2400);
        }
      }

      // =========================================================================
      // 6. 遮罩渲染輔助函式 (支援點擊單獨偷看)
      // =========================================================================
      function renderMaskedField(text, fieldType, revealKey, hintLabel) {
        const isMasked =
          (fieldType === 'ja' && state.maskJa) ||
          (fieldType === 'romaji' && state.maskRomaji) ||
          (fieldType === 'zh' && state.maskZh);

        const safeText = escapeHtml(text);
        if (!isMasked || state.revealedKeys.has(revealKey)) {
          return safeText;
        }

        return (
          '<button type="button" class="mask-btn" data-action="peek" data-reveal-key="' + escapeHtml(revealKey) + '" title="點擊偷看答案">' +
            '<span class="mask-blur">' + safeText + '</span>' +
            '<span class="mask-hint">' + escapeHtml(hintLabel) + '</span>' +
          '</button>'
        );
      }

      // =========================================================================
      // 7. 介面渲染：頂部進度、左側分類卡片、右側內容卡片
      // =========================================================================
      function getCategoryItems(cat) {
        const list = [];
        if (cat.vocab) cat.vocab.forEach(function (x) { list.push(x); });
        if (cat.sentences) cat.sentences.forEach(function (x) { list.push(x); });
        if (cat.qaList) cat.qaList.forEach(function (x) { list.push(x); });
        if (cat.patterns) cat.patterns.forEach(function (x) { list.push(x); });
        return list;
      }

      function filterItems(list) {
        if (!list) return [];
        return list.filter(function (item) {
          if (state.filterScope === 'core' && !item.core) return false;
          if (state.hideMastered && state.mastered.has(item.id)) return false;
          return true;
        });
      }

      function updateHeaderAndProgress() {
        // 數量晶片
        els.totalAllChip.textContent = String(ALL_IDS.length);
        els.coreTotalChip.textContent = String(CORE_IDS.length);

        // 篩選按鈕樣式
        els.btnFilterAll.classList.toggle('is-active', state.filterScope === 'all');
        els.btnFilterCore.classList.toggle('is-core-active', state.filterScope === 'core');
        els.btnHideMastered.classList.toggle('is-hide-active', state.hideMastered);

        // 三向遮罩按鈕樣式
        els.btnMaskJa.classList.toggle('is-active', state.maskJa);
        els.btnMaskRomaji.classList.toggle('is-active', state.maskRomaji);
        els.btnMaskZh.classList.toggle('is-active', state.maskZh);

        // 語速按鈕樣式
        els.btnRateNormal.classList.toggle('is-rate-active', state.speechRate === 1.0);
        els.btnRateSlow.classList.toggle('is-rate-active', state.speechRate === 0.75);

        // 雙進度條計算
        let coreDone = 0;
        for (let i = 0; i < CORE_IDS.length; i++) {
          if (state.mastered.has(CORE_IDS[i])) coreDone++;
        }
        const allDone = state.mastered.size;

        const corePct = CORE_IDS.length ? Math.round((coreDone / CORE_IDS.length) * 100) : 0;
        const allPct = ALL_IDS.length ? Math.round((allDone / ALL_IDS.length) * 100) : 0;

        els.coreProgressFill.style.width = corePct + '%';
        els.coreProgressText.textContent = coreDone + '/' + CORE_IDS.length + ' (' + corePct + '%)';

        els.allProgressFill.style.width = allPct + '%';
        els.allProgressText.textContent = allDone + '/' + ALL_IDS.length + ' (' + allPct + '%)';
      }

      function renderSidebar() {
        const html = CATEGORIES.map(function (cat) {
          const allCatItems = getCategoryItems(cat);
          const visibleCount = filterItems(allCatItems).length;
          const isActive = cat.key === state.activeCategory;
          const activeStyle = isActive
            ? 'border-color:' + cat.color + ';background-color:' + cat.bgTint + ';box-shadow:inset 4px 0 0 ' + cat.color + ';'
            : '';

          return (
            '<button type="button" class="cat-card-btn" data-cat-key="' + escapeHtml(cat.key) + '" style="' + activeStyle + '">' +
              '<div class="cat-card-top">' +
                '<span class="cat-card-title" style="' + (isActive ? 'color:' + cat.color + ';' : '') + '">' +
                  '<span>' + cat.icon + '</span>' +
                  '<span>' + escapeHtml(cat.name) + '</span>' +
                '</span>' +
                '<span class="cat-card-count">' + visibleCount + '</span>' +
              '</div>' +
              '<span class="cat-card-meta">' + escapeHtml(cat.meta) + '</span>' +
            '</button>'
          );
        }).join('');

        els.sidebarNav.innerHTML = html;
      }

      function renderVocabCard(item) {
        const isMastered = state.mastered.has(item.id);
        const cls = 'card-base vocab-card' + (item.core ? ' is-core' : '') + (isMastered ? ' is-mastered' : '');
        const checkCls = 'icon-btn' + (isMastered ? ' is-checked' : '');

        return (
          '<article class="' + cls + '">' +
            '<div class="vocab-left">' +
              '<div class="vocab-kana">' + renderMaskedField(item.kana, 'ja', item.id + ':kana', '假名') + '</div>' +
              '<div class="vocab-ja">' + renderMaskedField(item.ja, 'ja', item.id + ':ja', '顯示日文') + '</div>' +
              '<div class="vocab-romaji">' + renderMaskedField(item.romaji, 'romaji', item.id + ':romaji', '顯示拼音') + '</div>' +
            '</div>' +
            '<div class="vocab-right">' +
              '<div>' +
                '<div class="vocab-zh">' + renderMaskedField(item.zh, 'zh', item.id + ':zh', '顯示中文') + '</div>' +
                (item.note ? '<p class="vocab-note">' + escapeHtml(item.note) + '</p>' : '') +

              '<div class="sentence-kana">' + renderMaskedField(item.kana, 'ja', item.id + ':kana', '顯示假名') + '</div>' +
              '<div class="sentence-ja">' + renderMaskedField(item.ja, 'ja', item.id + ':ja', '顯示日文句型') + '</div>' +
              '<div class="sentence-romaji">' + renderMaskedField(item.romaji, 'romaji', item.id + ':romaji', '顯示羅馬拼音') + '</div>' +

                '<button type="button" class="' + checkCls + '" data-action="toggle-mastered" data-id="' + escapeHtml(item.id) + '" title="' + (isMastered ? '取消已熟記' : '標記為已熟記') + '" aria-label="切換已熟記">✓</button>' +
              '</div>' +
            '</div>' +
          '</article>'

      }

      function renderListeningCard(item) {
        const isMastered = state.mastered.has(item.id);
        const cls = 'card-base listening-card' + (item.core ? ' is-core' : '') + (isMastered ? ' is-mastered' : '');
        const checkCls = 'icon-btn' + (isMastered ? ' is-checked' : '');

        return (
          '<article class="' + cls + '">' +
            '<div class="listening-col clerk-col">' +
              '<div class="listening-body">' +
                '<div class="badge-row">' +
                  '<span class="role-badge role-clerk">店員提問</span>' +
                  '<span class="scene-tag">' + escapeHtml(item.scene) + '</span>' +
                '</div>' +
                '<div class="sentence-kana">' + renderMaskedField(item.clerk.kana, 'ja', item.id + ':ckana', '顯示假名') + '</div>' +
                '<div class="qa-ja">' + renderMaskedField(item.clerk.ja, 'ja', item.id + ':cja', '顯示店員日文') + '</div>' +
                '<div class="sentence-romaji">' + renderMaskedField(item.clerk.romaji, 'romaji', item.id + ':cromaji', '顯示拼音') + '</div>' +
                '<div class="qa-zh">' + renderMaskedField(item.clerk.zh, 'zh', item.id + ':czh', '顯示中文') + '</div>' +
              '</div>' +
              '<button type="button" class="icon-btn" data-action="speak" data-tts="' + escapeHtml(item.clerk.tts) + '" title="聽店員怎麼說" aria-label="朗讀店員提問">🔊</button>' +
            '</div>' +
            '<div class="listening-col">' +
              '<div class="listening-body">' +
                '<div class="badge-row">' +
                  '<span class="role-badge role-reply">你的道地回答</span>' +
                '</div>' +
                '<div class="sentence-kana">' + renderMaskedField(item.reply.kana, 'ja', item.id + ':rkana', '顯示假名') + '</div>' +
                '<div class="qa-ja">' + renderMaskedField(item.reply.ja, 'ja', item.id + ':rja', '顯示回答日文') + '</div>' +
                '<div class="sentence-romaji">' + renderMaskedField(item.reply.romaji, 'romaji', item.id + ':rromaji', '顯示拼音') + '</div>' +
                '<div class="qa-zh">' + renderMaskedField(item.reply.zh, 'zh', item.id + ':rzh', '顯示中文') + '</div>' +
                (item.reply.note ? '<p class="sentence-tip">💡 ' + escapeHtml(item.reply.note) + '</p>' : '') +
              '</div>' +
              '<div class="action-btns">' +
                '<button type="button" class="icon-btn" data-action="speak" data-tts="' + escapeHtml(item.reply.tts) + '" title="朗讀建議回答" aria-label="朗讀回答">🔊</button>' +
                '<button type="button" class="' + checkCls + '" data-action="toggle-mastered" data-id="' + escapeHtml(item.id) + '" title="' + (isMastered ? '取消已熟記' : '標記為已熟記') + '" aria-label="切換已熟記">✓</button>' +

      function renderGrammarCard(item) {
        const isMastered = state.mastered.has(item.id);
        const cls = 'card-base grammar-card' + (item.core ? ' is-core' : '') + (isMastered ? ' is-mastered' : '');
        const checkCls = 'icon-btn' + (isMastered ? ' is-checked' : '');

        const examplesHtml = item.examples.map(function (ex, idx) {
          const prefix = item.id + ':ex' + idx;
          return (
            '<div class="example-item">' +
              '<div style="min-width:0;display:flex;flex-direction:column;gap:2px;">' +
                '<div class="sentence-kana">' + renderMaskedField(ex.kana, 'ja', prefix + ':kana', '假名') + '</div>' +
                '<div class="sentence-ja" style="font-size:17.5px;">' + renderMaskedField(ex.ja, 'ja', prefix + ':ja', '顯示例句日文') + '</div>' +
                '<div class="sentence-romaji">' + renderMaskedField(ex.romaji, 'romaji', prefix + ':romaji', '顯示拼音') + '</div>' +
                '<div class="qa-zh" style="font-size:15px;">' + renderMaskedField(ex.zh, 'zh', prefix + ':zh', '顯示中文') + '</div>' +
              '</div>' +
              '<button type="button" class="icon-btn" data-action="speak" data-tts="' + escapeHtml(ex.tts) + '" title="朗讀例句" aria-label="朗讀例句">🔊</button>' +
            '</div>'
          );
        }).join('');

        const notesHtml = item.notes.map(function (note) {
          return '<li>' + note + '</li>';
        }).join('');

        return (
          '<article class="' + cls + '">' +
            '<div class="grammar-left">' +
              '<div class="grammar-title-row">' +
                '<span class="grammar-badge">' + escapeHtml(item.badge) + '</span>' +
                '<h3 class="grammar-title">' + escapeHtml(item.title) + '</h3>' +
                '<span class="grammar-meaning">（' + escapeHtml(item.meaning) + '）</span>' +
              '</div>' +
              '<div class="formula-box">公式：' + item.formulaHtml + '</div>' +
              '<div class="example-list">' + examplesHtml + '</div>' +
            '</div>' +
            '<div class="grammar-right">' +
              '<div class="grammar-right-top">' +
                '<span class="grammar-note-title">📌 延伸文法與實戰解說</span>' +
                '<button type="button" class="' + checkCls + '" data-action="toggle-mastered" data-id="' + escapeHtml(item.id) + '" title="' + (isMastered ? '取消已熟記' : '標記為已熟記') + '" aria-label="切換已熟記">✓</button>' +
              '</div>' +
              '<ul class="grammar-notes">' + notesHtml + '</ul>' +
            '</div>' +
          '</article>'
        );
      }

      function renderMainContent() {
        const cat = CATEGORIES.find(function (c) { return c.key === state.activeCategory; }) || CATEGORIES[0];
        const parts = [];

        // 分類標題區（無底色，僅底部分隔細線）
        parts.push(
          '<header class="section-header">' +
            '<h2><span>' + cat.icon + '</span><span>' + escapeHtml(cat.name) + '</span></h2>' +
            '<p>' + escapeHtml(cat.subtitle) + '</p>' +
          '</header>'
        );

        let visibleTotal = 0;

        if (cat.vocab) {
          const filteredVocab = filterItems(cat.vocab);
          visibleTotal += filteredVocab.length;
          if (filteredVocab.length) {
            parts.push(
              '<section>' +
                '<h3 class="sub-heading">核心單字（' + filteredVocab.length + '）</h3>' +
                '<div class="vocab-grid">' + filteredVocab.map(renderVocabCard).join('') + '</div>' +
              '</section>'
            );
          }
        }

        if (cat.sentences) {
          const filteredSentences = filterItems(cat.sentences);
          visibleTotal += filteredSentences.length;
          if (filteredSentences.length) {
            parts.push(
              '<section>' +
                '<h3 class="sub-heading">實戰句型（' + filteredSentences.length + '）</h3>' +
                '<div class="stack-list">' +
                  filteredSentences.map(function (s) { return renderSentenceCard(s, cat.color); }).join('') +
                '</div>' +
              '</section>'
            );
          }
        }

        if (cat.qaList) {
          const filteredQa = filterItems(cat.qaList);
          visibleTotal += filteredQa.length;
          if (filteredQa.length) {
            parts.push(
              '<section>' +
                '<div class="stack-list">' + filteredQa.map(renderListeningCard).join('') + '</div>' +
              '</section>'
            );
          }
        }

        if (cat.patterns) {
          const filteredPatterns = filterItems(cat.patterns);
          visibleTotal += filteredPatterns.length;
          if (filteredPatterns.length) {
            parts.push(
              '<section>' +
                '<div class="stack-list">' + filteredPatterns.map(renderGrammarCard).join('') + '</div>' +
              '</section>'
            );
          }
        }

        if (visibleTotal === 0) {
          parts.push(
            '<div class="empty-state">' +
              '<h3>這個分類在目前篩選條件下已全部完成！</h3>' +
              '<p>您可以切換左側其他分類，或取消「隱藏已熟記／必背」篩選檢視完整內容。</p>' +
              '<button type="button" class="empty-btn" data-action="clear-filters">顯示本分類全部卡片</button>' +
            '</div>'
          );
        }

        els.contentContainer.innerHTML = parts.join('');
      }

      function updateAllUI() {
        updateHeaderAndProgress();
        renderSidebar();
        renderMainContent();
      }

      // =========================================================================
      // 8. 事件綁定與事件委派
      // =========================================================================
      els.btnFilterAll.addEventListener('click', function () {
        state.filterScope = 'all';
        updateAllUI();
      });

      els.btnFilterCore.addEventListener('click', function () {
        state.filterScope = 'core';
        updateAllUI();
      });

      els.btnHideMastered.addEventListener('click', function () {
        state.hideMastered = !state.hideMastered;
        updateAllUI();
      });

      els.btnMaskJa.addEventListener('click', function () {
        state.maskJa = !state.maskJa;
        state.revealedKeys.clear();
        updateAllUI();
      });

      els.btnMaskRomaji.addEventListener('click', function () {
        state.maskRomaji = !state.maskRomaji;
        state.revealedKeys.clear();
        updateAllUI();
      });

      els.btnMaskZh.addEventListener('click', function () {
        state.maskZh = !state.maskZh;
        state.revealedKeys.clear();
        updateAllUI();
      });

      els.btnRateNormal.addEventListener('click', function () {
        state.speechRate = 1.0;
        updateHeaderAndProgress();
      });

      els.btnRateSlow.addEventListener('click', function () {
        state.speechRate = 0.75;
        updateHeaderAndProgress();
      });

      els.btnSyncProgress.addEventListener('click', handleExportSync);

      // 兩段式安全重置（不使用原生 confirm）
      els.btnResetProgress.addEventListener('click', function () {
        if (!els.btnResetProgress.classList.contains('is-confirm')) {
          els.btnResetProgress.classList.add('is-confirm');
          els.btnResetProgress.textContent = '確定重置？';
          state.resetConfirmTimer = window.setTimeout(function () {
            els.btnResetProgress.classList.remove('is-confirm');
            els.btnResetProgress.textContent = '重置';
          }, 3000);
          return;
        }

        if (state.resetConfirmTimer) {
          window.clearTimeout(state.resetConfirmTimer);
          state.resetConfirmTimer = null;
        }
        els.btnResetProgress.classList.remove('is-confirm');
        els.btnResetProgress.textContent = '重置';
        state.mastered.clear();
        saveProgressToStorage();
        updateAllUI();
        showToast('已清空所有熟記進度紀錄', 2600);
      });

      // 左側大分類切換（事件委派）
      els.sidebarNav.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-cat-key]');
        if (!btn) return;
        const nextKey = btn.getAttribute('data-cat-key');
        if (nextKey && nextKey !== state.activeCategory) {
          state.activeCategory = nextKey;
          state.revealedKeys.clear();
          updateAllUI();
          els.mainScrollArea.scrollTop = 0;
        }
      });

      // 右側主內容區互動（發音 / 熟記切換 / 遮罩偷看 / 清除篩選）
      els.contentContainer.addEventListener('click', function (e) {
        const target = e.target.closest('[data-action]');
        if (!target) return;

        const action = target.getAttribute('data-action');
        if (action === 'speak') {
          const ttsText = target.getAttribute('data-tts');
          if (ttsText) speakJapanese(ttsText, target);
          return;
        }

        if (action === 'toggle-mastered') {
          const id = target.getAttribute('data-id');
          if (!id) return;
          if (state.mastered.has(id)) {
            state.mastered.delete(id);
          } else {
            state.mastered.add(id);
          }
          saveProgressToStorage();
          updateAllUI();
          return;
        }

        if (action === 'peek') {
          const key = target.getAttribute('data-reveal-key');
          if (key) {
            state.revealedKeys.add(key);
            renderMainContent();
          }
          return;
        }

        if (action === 'clear-filters') {
          state.filterScope = 'all';
          state.hideMastered = false;
          updateAllUI();
        }
      });

      // 手動複製備援視窗事件
      els.btnSyncModalCopy.addEventListener('click', function () {
        els.syncModalInput.focus();
        els.syncModalInput.select();
        const ok = copyViaExecCommand(els.syncModalInput.value);
        if (ok) {
          closeSyncModal();
          showToast('✅ 已複製同步網址，在其他裝置貼上開啟即可同步', 3200);
        }
      });

      els.btnSyncModalClose.addEventListener('click', closeSyncModal);
      els.syncModalBackdrop.addEventListener('click', function (e) {
        if (e.target === els.syncModalBackdrop) closeSyncModal();
      });

      // 監聽網址 hash 變化（方便使用者直接貼上 #sync=... 切換進度）
      window.addEventListener('hashchange', checkAndApplySyncFromHash);

      // =========================================================================
      // 9. 初始化啟動
      // =========================================================================
      function init() {
        loadProgressFromStorage();
        const loadedFromSync = checkAndApplySyncFromHash();
        if (!loadedFromSync) {
          updateAllUI();
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
